<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>Accesso · GLS Monitor</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#e7eaf0;--bg:#f4f6f9;--navy:#071827;--navy-2:#0c2335;
          --accent:#1469c9;--accent-2:#0f5bb0;--critical:#b42318;--critical-bg:#fff1f0;--radius:16px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
         font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--ink);background:linear-gradient(140deg,var(--navy),var(--navy-2))}
    .card{width:100%;max-width:404px;background:#fff;border-radius:var(--radius);padding:30px;
          box-shadow:0 24px 60px rgba(0,0,0,.28)}
    .brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}
    .mark{width:46px;height:46px;border-radius:14px;background:var(--navy);color:#fff;display:grid;
          place-items:center;font-weight:900;font-size:23px}
    .eyebrow{font-size:10px;letter-spacing:.16em;font-weight:850;color:var(--muted)}
    h1{margin:2px 0 0;font-size:23px;letter-spacing:-.03em}
    label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
          font-weight:850;color:var(--muted);margin:0 0 6px}
    .field{margin-bottom:15px}
    input{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;font:inherit;outline:0}
    input:focus{border-color:#84adf4;box-shadow:0 0 0 3px rgba(20,105,201,.1)}
    button{width:100%;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:760;color:#fff;
           background:var(--accent);cursor:pointer;transition:.15s ease}
    button:hover:not(:disabled){background:var(--accent-2)}
    button:disabled{opacity:.6;cursor:not-allowed}
    .error{display:none;background:var(--critical-bg);border:1px solid #fecdca;color:var(--critical);
           border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:15px}
    .error.show{display:block}
    .foot{margin-top:18px;color:var(--muted);font-size:11.5px;line-height:1.5}
    /* Discreta, in fondo alla pagina: dice a quando e' aggiornata la piattaforma. */
    .build-info{position:fixed;left:0;right:0;bottom:14px;margin:0;text-align:center;
                font-size:11px;color:rgba(255,255,255,.42)}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="mark">G</div>
      <div><div class="eyebrow">ZUIKI · OPERATIONS</div><h1>GLS Monitor</h1></div>
    </div>

    <div id="error" class="error" role="alert"></div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">Email operatore</label>
        <input id="username" name="username" type="email" autocomplete="username"
               required autofocus placeholder="nome@zuiki.it">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button id="submit" type="submit">Entra</button>
    </form>

    <p class="foot">L'accesso resta valido su questo browser finché ti colleghi
    dalla stessa rete. Da una rete diversa vengono richieste di nuovo le credenziali.</p>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');
    const submit = document.getElementById('submit');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('show');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.classList.remove('show');
      submit.disabled = true;
      submit.textContent = 'Verifica…';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || 'Accesso non riuscito');
        window.location.replace('/');
      } catch (err) {
        showError(err.message);
        submit.disabled = false;
        submit.textContent = 'Entra';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });
  </script>
  <script>
    // Quando e' stata messa online questa versione: serve a capire a colpo
    // d'occhio se si sta guardando l'ultima, senza chiedere a nessuno.
    fetch('/api/status').then(r => r.json()).then(d => {
      if (!d.build) return;
      const nota = document.getElementById('buildInfo');
      if (nota) nota.textContent = 'Aggiornato al ' + d.build;
    }).catch(() => {});
  </script>
  <p id="buildInfo" class="build-info"></p>
</body>
</html>
